# Workspace-Wurzel. `core` = portabler, Tauri-freier Logik-Kern (lokal testbar);
# `src-tauri` = die Desktop-App, die CI über `npm run tauri build` baut.
# `theorg/thedex` = THEDEX-Dateischnittstelle für den THEORG-Connector (reine Bibliothek).
[workspace]
members = ["core", "src-tauri", "theorg/thedex"]
resolver = "2"

[workspace.package]
version = "0.2.30"
edition = "2021"
license = "UNLICENSED"
authors = ["IntensivKontakt GmbH"]
