[package]
name = "praxishub-thedex"
description = "THEDEX-Dateischnittstelle (THEORG) für den Praxishub-Connector: Parser, Ordner-Logik, Abbildung auf Connector v2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "praxishub_thedex"

[[bin]]
name = "thedex-probe"
path = "src/bin/thedex-probe.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
